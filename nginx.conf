server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
  add_header X-Content-Type-Options nosniff always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location ~* \.wasm$ { default_type application/wasm; expires 1y; }
  # A location with its own add_header drops the server-level ones, so repeat them here.
  # /assets/ holds Vite's content-hashed build files: cache for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
    add_header X-Content-Type-Options nosniff always;
  }
  # Default artwork and fonts keep their names across releases: always revalidate
  # (cheap 304s), so a changed file is picked up on the next load.
  location /artwork/ {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /fonts/ {
    types { font/ttf ttf; font/otf otf; text/plain txt; }
    default_type text/plain;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
    add_header X-Content-Type-Options nosniff always;
  }
  # The page itself: always revalidate, so a new deploy is picked up on the next load.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
