server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:" always;
  add_header X-Content-Type-Options nosniff always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location ~* \.wasm$ { default_type application/wasm; expires 1y; }
  location ~* \.ttf$ { default_type font/ttf; expires 1y; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
