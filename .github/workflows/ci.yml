name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: QR round trip and PDF preflight
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm run sample
          for f in out/sample-*.pdf; do
            test "$(pdffonts "$f" | tail -n +3 | wc -l)" = 0 || { echo "fonts in $f"; exit 1; }
            test "$(pdfimages -list "$f" | tail -n +3 | wc -l)" = 0 || { echo "images in $f"; exit 1; }
          done
          npm run qa:qr
